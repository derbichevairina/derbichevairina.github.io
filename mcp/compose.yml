# Booking MCP server, installed at /opt/psyholog-mcp by scripts/deploy-mcp.sh.
# Host network: it reads Cal.com on 127.0.0.1:3000 and listens on 127.0.0.1:3200 for nginx.
services:
  booking-mcp:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "3200"
    logging:  # only warnings and errors are logged; this caps how much of them is kept
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    cpus: 0.25
    mem_limit: 128m
