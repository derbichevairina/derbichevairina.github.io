worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    access_log off;

    include /etc/nginx/conf.d/markdown-negotiation.conf;

    server {
        listen 80;
        root /var/www/site;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        include /etc/nginx/snippets/slots-locations.conf;

        location / {
            include /etc/nginx/snippets/markdown-location.conf;
        }
    }
}
