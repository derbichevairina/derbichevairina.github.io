# Every text file the site serves is UTF-8. Without this nginx sends .txt, .xml and .css
# with no charset at all and the browser guesses — Cyrillic in llms.txt comes out as mojibake.
# Installed at /etc/nginx/snippets/charset.conf, included in the server block.

charset utf-8;
charset_types text/plain text/css text/xml text/markdown application/json application/javascript image/svg+xml;
