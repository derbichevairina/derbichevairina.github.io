# Free booking slots, refreshed by the calendly-slots timer.
# Installed at /etc/nginx/snippets/slots-locations.conf, included in the server block.
# They live outside /var/www/psyholog because the site deploy rsyncs it with --delete.

location = /slots.json {
    alias /var/www/psyholog-slots/slots.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header Vary "Accept-Encoding" always;
}

location = /slots.md {
    alias /var/www/psyholog-slots/slots.md;
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "public, max-age=300" always;
    add_header Vary "Accept-Encoding" always;
}
