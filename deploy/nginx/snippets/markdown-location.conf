# Body of the site's `location /`, shared by production and the Docker test suite.
# Installed at /etc/nginx/snippets/markdown-location.conf.
# Requires the maps from conf.d/markdown-negotiation.conf.

# .md is absent from mime.types, so the default type is what markdown responses get.
default_type "text/markdown; charset=utf-8";

# Without Accept in Vary a cache can hand the HTML variant to an agent asking for markdown.
add_header Vary "Accept, Accept-Encoding" always;

if ($nothing_acceptable) {
    return 406;
}

try_files $markdown_root$markdown_uri $markdown_root$uri.md $uri $uri/ $uri.html =404;
