# Proactive content negotiation for text/markdown — https://acceptmarkdown.com, RFC 9110 §12.5.1.
# Quality values are read with one decimal of precision: q=0.85 is treated as q=0.8.
# Installed at /etc/nginx/conf.d/markdown-negotiation.conf (http context, maps only).

# Quality the client assigned to text/markdown. Only an explicit media type counts:
# a client asking for */* must keep getting HTML, the way browsers and crawlers do today.
map $http_accept $accept_markdown_q {
    default                                "00";
    "~*text/markdown\s*;\s*q=1(\.0*)?"     "10";
    "~*text/markdown\s*;\s*q=0\.(\d)"      "0$1";
    "~*text/markdown\s*;\s*q=0"            "00";
    "~*text/markdown"                      "10";
}

# Quality the client assigned to HTML, falling back to the text/* and */* wildcards.
# A request without an Accept header means "anything", i.e. HTML.
map $http_accept $accept_html_q {
    default                                "00";
    ""                                     "10";
    "~*text/html\s*;\s*q=1(\.0*)?"         "10";
    "~*text/html\s*;\s*q=0\.(\d)"          "0$1";
    "~*text/html\s*;\s*q=0"                "00";
    "~*text/html"                          "10";
    "~*text/\*\s*;\s*q=0\.(\d)"            "0$1";
    "~*text/\*"                            "10";
    "~*\*/\*\s*;\s*q=0\.(\d)"              "0$1";
    "~*\*/\*"                              "10";
}

# Markdown wins only when the client wants it at least as much as HTML.
# Both quantities are two-digit, so one regex per markdown quality covers the comparison.
map "$accept_markdown_q:$accept_html_q" $negotiated_variant {
    default            "html";
    "00:00"            "none";
    "~^10:"            "markdown";
    "~^09:0[0-9]$"     "markdown";
    "~^08:0[0-8]$"     "markdown";
    "~^07:0[0-7]$"     "markdown";
    "~^06:0[0-6]$"     "markdown";
    "~^05:0[0-5]$"     "markdown";
    "~^04:0[0-4]$"     "markdown";
    "~^03:0[0-3]$"     "markdown";
    "~^02:0[0-2]$"     "markdown";
    "~^01:0[0-1]$"     "markdown";
}

# Markdown file that backs a URL: both /trevoga/ and /trevoga lead to /trevoga/index.md
map $uri $markdown_uri {
    default        "$uri.md";
    "~^(.*)/$"     "$1/index.md";
    "~^[^.]*$"     "$uri/index.md";
}

# Prefix that makes the markdown candidate unreachable unless markdown actually won.
map $negotiated_variant $markdown_root {
    default        "/nonexistent";
    "markdown"     "";
}

# A page URL has no file extension; assets and downloads must never be answered with 406.
map $uri $uri_is_page {
    default        0;
    "~^[^.]*$"     1;
}

map "$uri_is_page:$negotiated_variant" $nothing_acceptable {
    default        0;
    "1:none"       1;
}
